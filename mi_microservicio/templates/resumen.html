<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Usuarios</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 18px;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h2>Resumen de Usuarios</h2>
    <div id="error-message" style="color: red;"></div>
    <table id="usuarios-table" style="display: none;">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Campos Llenos</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se generarán las filas de los usuarios -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = document.cookie
                .split('; ')
                .find(row => row.startsWith('authToken='))
                ?.split('=')[1];

            if (!token) {
                document.getElementById('error-message').textContent = 'No estás autenticado. Inicia sesión para continuar.';
                return;
            }

            fetch('/api/usuarios/resumen', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
.then(data => {
    if (data.error) {
        document.getElementById('error-message').textContent = data.error;
    } else {
        document.getElementById('error-message').textContent = '';
        const usuariosTable = document.getElementById('usuarios-table');
        const tbody = usuariosTable.querySelector('tbody');
        tbody.innerHTML = '';
        data.forEach(usuario => {  // Cambia aquí: data en lugar de data.usuarios
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${usuario.nombre}</td><td>${usuario.campos_llenos.join(', ')}</td>`;
            tbody.appendChild(tr);
        });
        usuariosTable.style.display = 'table';
    }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('error-message').textContent = 'Hubo un error al cargar los usuarios';
            });
        });
    </script>
</body>
</html>
