<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            color: #333 !important;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,.1);
            overflow: hidden;
        }
        .card-header {
            background-color: #333;
            color: white;
            border-bottom: none;
            padding: 1rem;
            font-weight: bold;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #f8f9fa;
            color: #333;
            border-top: none;
            border-bottom: 2px solid #dee2e6;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-users me-2"></i>Resumen de Usuarios</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <!-- Mensaje de error -->
                <div id="error-message" class="alert alert-danger rounded-pill" style="display: none;"></div>
                <!-- Contenedor principal de la tabla -->
                <div id="table-container">
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-table me-1"></i>
                            Datos de Usuarios
                        </div>
                        <div class="card-body">
                            <table id="usuarios-table" class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Campos Llenos</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Aquí se generarán las filas de los usuarios -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Extraer el token de las cookies
            const token = document.cookie
                .split('; ')
                .find(row => row.startsWith('authToken='))
                ?.split('=')[1];

            const errorMessageEl = document.getElementById('error-message');
            const tableContainer = document.getElementById('table-container');

            if (!token) {
                errorMessageEl.textContent = 'No estás autenticado. Inicia sesión para continuar.';
                errorMessageEl.style.display = 'block';
                tableContainer.style.display = 'none';
                return;
            }
    
            fetch('/api/usuarios/resumen', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Usuario no autorizado');
                    } else {
                        throw new Error('Hubo un error al cargar los usuarios');
                    }
                }
                return response.json();
            })
            .then(data => {
                // Si existe algún error en la respuesta
                if (data.error) {
                    throw new Error(data.error);
                }
                // Limpiar el mensaje de error
                errorMessageEl.textContent = '';
                errorMessageEl.style.display = 'none';

                const usuariosTable = document.getElementById('usuarios-table');
                const tbody = usuariosTable.querySelector('tbody');
                tbody.innerHTML = '';

                data.forEach(usuario => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${usuario.nombre}</td>
                        <td>${usuario.campos_llenos.join(', ')}</td>
                        <td><button class="btn btn-primary btn-sm consumir-btn" data-user-id="${usuario.user_id}">Consumir</button></td>
                    `;
                    tbody.appendChild(tr);
                });
                usuariosTable.style.display = 'table';

                // Agregar evento a los botones "Consumir"
                document.querySelectorAll('.consumir-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const userId = this.getAttribute('data-user-id');
                        fetch(`/api/usuarios/${userId}/datos`, {
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        })
                        .then(response => {
                            if (!response.ok) {
                                if (response.status === 403) {
                                    throw new Error('Usuario no autorizado');
                                } else {
                                    throw new Error('Hubo un error al descargar los datos del usuario');
                                }
                            }
                            return response.json();
                        })
                        .then(data => {
                            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `usuario_${userId}_datos.json`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert(error.message);
                        });
                    });
                });
            })
            .catch(error => {
                console.error('Error:', error);
                errorMessageEl.textContent = error.message;
                errorMessageEl.style.display = 'block';
                // Ocultar la tabla y cualquier otro contenido de la página
                tableContainer.style.display = 'none';
            });
        });
    </script>
</body>
</html>
