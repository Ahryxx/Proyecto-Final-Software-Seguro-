<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Usuario</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .profile-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
      position: relative;
    }
    .profile-container h2 {
      margin-bottom: 20px;
      color: #333;
      font-weight: bold;
    }
    .profile-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    .profile-container button {
      width: 100%;
      padding: 12px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    .profile-container button:hover {
      background-color: #555;
    }
    .error-message {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
      margin-right: 10px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #333;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .disabled {
      background-color: #e9ecef;
      pointer-events: none;
    }
    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .input-group input[type="text"],
    .input-group input[type="email"],
    .input-group input[type="date"] {
      flex-grow: 1;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2><i class="fas fa-user-circle"></i> Perfil de Usuario</h2>
    <form id="profileForm">
      <div class="input-group">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
      </div>

      <div class="input-group">
        <label class="switch">
          <input type="checkbox" id="toggleCorreo">
          <span class="slider"></span>
        </label>
        <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
      </div>

      <div class="input-group">
        <label class="switch">
          <input type="checkbox" id="toggleCi">
          <span class="slider"></span>
        </label>
        <input type="text" id="ci" name="ci" placeholder="Cédula de identidad">
      </div>

      <div class="input-group">
        <label class="switch">
          <input type="checkbox" id="toggleTelefono">
          <span class="slider"></span>
        </label>
        <input type="text" id="numero_telefono" name="numero_telefono" placeholder="Número de teléfono">
      </div>

      <div class="input-group">
        <label class="switch">
          <input type="checkbox" id="toggleDireccion">
          <span class="slider"></span>
        </label>
        <input type="text" id="direccion" name="direccion" placeholder="Dirección">
      </div>

      <div class="input-group">
        <label class="switch">
          <input type="checkbox" id="toggleFechaExpiracion">
          <span class="slider"></span>
        </label>
        <input type="date" id="fecha_expiracion" name="fecha_expiracion" placeholder="Fecha de expiración">
      </div>

      <button type="submit">Guardar Cambios</button>
    </form>
    <div id="errorMessage" class="error-message" style="display: none;"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('profileForm');
      const errorMessage = document.getElementById('errorMessage');

      // Función para ocultar el formulario
      function hideForm() {
        form.style.display = 'none';
      }

      // Obtener el user_id desde la URL
      const userId = window.location.pathname.split('/').pop();
      
      // Obtener el token de las cookies
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }
      const token = getCookie('authToken');

      // Solicitud GET para obtener los datos del usuario
      fetch(`http://localhost:5001/usuarios/${userId}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      })
      .then(response => {
        if (!response.ok) {
          if (response.status === 403) {
            throw new Error('Usuario no autorizado');
          } else {
            throw new Error('Hubo un error al cargar los datos del usuario');
          }
        }
        return response.json();
      })
      .then(data => {
        // Completar el formulario con los datos obtenidos
        document.getElementById('nombre').value = data.nombre || '';
        document.getElementById('correo').value = data.correo || '';
        document.getElementById('ci').value = data.ci || '';
        document.getElementById('numero_telefono').value = data.numero_telefono || '';
        document.getElementById('direccion').value = data.direccion || '';
        document.getElementById('fecha_expiracion').value = data.fecha_expiracion || '';

        // Actualizar el estado de los switches y campos
        document.getElementById('toggleCorreo').checked = !!data.correo;
        document.getElementById('correo').disabled = !document.getElementById('toggleCorreo').checked;

        document.getElementById('toggleCi').checked = !!data.ci;
        document.getElementById('ci').disabled = !document.getElementById('toggleCi').checked;

        document.getElementById('toggleTelefono').checked = !!data.numero_telefono;
        document.getElementById('numero_telefono').disabled = !document.getElementById('toggleTelefono').checked;

        document.getElementById('toggleDireccion').checked = !!data.direccion;
        document.getElementById('direccion').disabled = !document.getElementById('toggleDireccion').checked;

        document.getElementById('toggleFechaExpiracion').checked = !!data.fecha_expiracion;
        document.getElementById('fecha_expiracion').disabled = !document.getElementById('toggleFechaExpiracion').checked;
      })
      .catch(error => {
        console.error('Error:', error);
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
        if (error.message === 'Usuario no autorizado') {
          hideForm();
        }
      });

      // Manejo del envío del formulario para actualizar datos
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        errorMessage.style.display = 'none';
        errorMessage.textContent = '';

        const nombre = document.getElementById('nombre').value.trim();
        const correo = document.getElementById('correo').value.trim();
        const ci = document.getElementById('ci').value.trim();
        const fechaExpiracion = document.getElementById('fecha_expiracion').value;

        if (nombre === '') {
          showError('El nombre es obligatorio.');
          return;
        }

        if (correo !== '' && !isValidEmail(correo)) {
          showError('Por favor, introduce un correo electrónico válido.');
          return;
        }

        if (ci !== '' && !isValidCI(ci)) {
          showError('Por favor, introduce una cédula de identidad válida.');
          return;
        }

        if (numero_telefono !== '' && !isValidPhoneNumber(numero_telefono)) {
  showError('Por favor, introduce un número de teléfono válido.');
  return;
}


        if (fechaExpiracion !== '' && !isFutureDate(fechaExpiracion)) {
          showError('La fecha de expiración debe ser posterior a la fecha actual.');
          return;
        }

        // Construir objeto con los datos del formulario
        const formData = {
          nombre: document.getElementById('nombre').value, // El nombre siempre se envía
          correo: document.getElementById('toggleCorreo').checked ? document.getElementById('correo').value : null,
          ci: document.getElementById('toggleCi').checked ? document.getElementById('ci').value : null,
          numero_telefono: document.getElementById('toggleTelefono').checked ? document.getElementById('numero_telefono').value : null,
          direccion: document.getElementById('toggleDireccion').checked ? document.getElementById('direccion').value : null,
          fecha_expiracion: document.getElementById('toggleFechaExpiracion').checked ? document.getElementById('fecha_expiracion').value : null
        };

        fetch(`http://localhost:5001/usuarios/${userId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(formData)
        })
        .then(response => {
          if (!response.ok) {
            if (response.status === 403) {
              throw new Error('Usuario no autorizado');
            } else {
              throw new Error('Hubo un error al actualizar los datos');
            }
          }
          return response.json();
        })
        .then(data => {
          if (data.error) {
            errorMessage.textContent = data.error;
            errorMessage.style.display = 'block';
          } else {
            alert('Datos actualizados correctamente');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          errorMessage.textContent = error.message;
          errorMessage.style.display = 'block';
          if (error.message === 'Usuario no autorizado') {
            hideForm();
          }
        });
      });

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
      }

      function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
      }

      function isValidCI(ci) {
        // Validación básica; ajustar según las reglas específicas de tu país
        return /^\d{7,10}$/.test(ci);
      }

      function isFutureDate(date) {
        const selectedDate = new Date(date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return selectedDate > today;
      }
      
      function isValidPhoneNumber(phoneNumber) {
  const phoneRegex = /^[0-9]{7,15}$/; // Solo números, entre 7 y 15 dígitos
  return phoneRegex.test(phoneNumber);
}


      // Funcionalidad de los switches para habilitar/deshabilitar campos
      document.getElementById('toggleCorreo').addEventListener('change', function() {
        const correoField = document.getElementById('correo');
        if (!this.checked) {
          correoField.value = '';
        }
        correoField.disabled = !this.checked;
      });

      document.getElementById('toggleCi').addEventListener('change', function() {
        const ciField = document.getElementById('ci');
        if (!this.checked) {
          ciField.value = '';
        }
        ciField.disabled = !this.checked;
      });

      document.getElementById('toggleTelefono').addEventListener('change', function() {
        const telefonoField = document.getElementById('numero_telefono');
        if (!this.checked) {
          telefonoField.value = '';
        }
        telefonoField.disabled = !this.checked;
      });

      document.getElementById('toggleDireccion').addEventListener('change', function() {
        const direccionField = document.getElementById('direccion');
        if (!this.checked) {
          direccionField.value = '';
        }
        direccionField.disabled = !this.checked;
      });

      document.getElementById('toggleFechaExpiracion').addEventListener('change', function() {
        const fechaField = document.getElementById('fecha_expiracion');
        if (!this.checked) {
          fechaField.value = '';
        }
        fechaField.disabled = !this.checked;
      });
    });
  </script>
</body>
</html>
